<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Inter', Arial, sans-serif; background-color: #f8f9fa; color: #1a1a1a; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border-top: 4px solid #ff6b00; }
    .logo { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: #1a1a1a; margin-bottom: 20px; }
    .details { white-space: pre-line; background: #f8f9fa; border-radius: 6px; padding: 16px; font-size: 14px; }
    .btn { display: inline-block; background-color: #1a1a1a; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 4px; font-weight: bold; margin: 20px 0; }
    .footer { margin-top: 40px; font-size: 12px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span style="color: #c44700;">industigo</span></div>
    <h2>{{ heading }}</h2>
    <p>Bonjour {{ name }},</p>
    <p style="white-space: pre-line;">{{ intro }}</p>
    <div class="details">{{ details }}</div>
    <div style="text-align: center;">
      <a href="{{ ctaUrl }}" class="btn" style="color: #ffffff;">{{ ctaLabel }}</a>
    </div>
    <p>Cordialement,<br>L'équipe Industigo</p>
    <div class="footer">Vous recevez cet e-mail car vous avez un compte sur Industigo.<br>© Industigo</div>
  </div>
</body>
</html>
