<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #1a1a1a; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border-top: 4px solid #e11d48; }
    .logo { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: #1a1a1a; margin-bottom: 20px; }
    .error-icon { font-size: 40px; text-align: center; margin: 20px 0; }
    .reason-box { background: #fef2f2; border: 1px solid #fecdd3; border-left: 4px solid #e11d48; padding: 15px; margin: 20px 0; border-radius: 4px; }
    .btn { display: inline-block; background-color: #c44700; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 4px; font-weight: bold; margin: 20px 0; }
    .footer { margin-top: 40px; font-size: 12px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span style="color: #c44700;">industigo</span></div>
    <h2>Nouveau message du formulaire de contact</h2>
    <div class="reason-box" style="background:#f8fafc;border-color:#e2e8f0;border-left-color:#1B4D2E;">
      <strong>Nom :</strong> {{ name }}<br>
      <strong>E-mail :</strong> {{ email }}<br>
      <strong>Sujet :</strong> {{ subject }}
    </div>
    <p style="white-space: pre-wrap;">{{ message }}</p>
    <p>Cordialement,<br>L'équipe Industigo</p>
    <div class="footer">© 2026 Industigo. Tous droits réservés.</div>
  </div>
</body>
</html>
